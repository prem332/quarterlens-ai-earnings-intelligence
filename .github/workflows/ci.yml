name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verifies the multi-stage build (frontend npm build -> Python backend +
      # ODBC driver install) actually succeeds end to end. Never pushed
      # anywhere — this only confirms the image builds, it does not deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        env:
          # Default buildx progress output collapses each RUN step's stdout
          # into a condensed summary on failure — the actual apt-get error
          # text (the thing that explains *why* exit code 100 happened) gets
          # swallowed. Plain mode streams every line so failures are debuggable
          # from the Actions log instead of needing a local reproduction.
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: false
          tags: quarterlens-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max