name: Eval Gate

# Deploy gate. Two jobs, cheap-first:
#   1. smoke-test    — one real claim through the full LangGraph pipeline,
#                       asserting it completes, non-empty, within budget.
#                       No RAGAS/LLM-judge scoring — see smoke_test.py.
#   2. quality-gate   — only runs if smoke-test passes. A small stratified
#                       sample (default 10 claims) scored against the same
#                       RAGAS/LLM-judge metrics run_baseline_eval.py
#                       computes, checked against regression-guard floors —
#                       see evaluation/eval_gate_check.py's docstring for
#                       why these are floors, not the aspirational targets.
# Called by deploy.yml before it will build/push an image (deploy only
# proceeds if BOTH jobs succeed — a called reusable workflow's overall
# status is success only if every job in it succeeds); can also be
# triggered manually to sanity-check main at any time.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: declaring one changes the OIDC
    # subject claim to repo:<org>/<repo>:environment:<name>, which the
    # existing federated credential (scoped to repo:<org>/<repo>:ref:
    # refs/heads/main) doesn't match -- confirmed via a real
    # AADSTS700213 failure. Secrets used below are repo-level, not
    # environment-scoped, so this was never doing anything useful anyway.
    permissions:
      id-token: write   # OIDC federated login -- same identity deploy.yml uses
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No service-principal secret here. azure/login authenticates the
      # runner's az CLI session via OIDC; DefaultAzureCredential (used by
      # azure_clients/key_vault_client.py, unchanged) falls back through its
      # chain to AzureCliCredential and picks that session up automatically.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run smoke test against live Azure resources
        env:
          AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
        run: python evaluation/smoke_test.py

  quality-gate:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC federated login -- same identity smoke-test uses
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run eval-metric threshold gate
        env:
          AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
        run: python evaluation/eval_gate_check.py
