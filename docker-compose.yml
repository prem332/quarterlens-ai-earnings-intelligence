services:
  quarterlens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Not committed — copy .env.example to .env and fill in the secrets
      # (or individual AZURE_* vars) per azure_clients/key_vault_client.py's
