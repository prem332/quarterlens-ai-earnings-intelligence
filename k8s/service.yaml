# ClusterIP, not LoadBalancer: a Standard Load Balancer bills continuously
# (~$0.025/hr + data processing) on top of the node cost, for no benefit in
# a same-session verify-and-teardown POC. Reach it with:
#   kubectl -n quarterlens port-forward svc/quarterlens-api 8000:80
apiVersion: v1
kind: Service
metadata:
  name: quarterlens-api
  namespace: quarterlens
spec:
  type: ClusterIP
  selector:
    app: quarterlens-api
  ports:
    - port: 80
      targetPort: 8000
