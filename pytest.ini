[pytest]
# `pytest tests/ -q` (the bare console-script entry point, as run in CI) does
# not put the repo root on sys.path, so `from api.guardrails import ...` etc.
# fails with ModuleNotFoundError — only `python -m pytest` does that
# automatically, via its cwd-insertion behavior. This ini option makes it
# work identically either way, matching how `python -m ...` is invoked
# everywhere else in this repo (evaluation/run_baseline_eval.py, etc).
pythonpath = .
